<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datama Compare</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff; }
  #light-runner-wrap { width: 100%; min-height: 600px; }
  #light-runner-iframe {
    width: 100%;
    height: 600px;
    border: 1px solid #ddd;
    border-radius: 6px;
    display: block;
  }
</style>
</head>
<body>
<div id="light-runner-wrap">
  <iframe
    id="light-runner-iframe"
    src="https://storage.googleapis.com/app2.datama.io/ai-datama-light/latest/compare/runner.ai-toolkit.html"
    title="Datama Compare"></iframe>
</div>
<script>
(function () {
  // --- Substituted by Claude when producing the Artifact ---
  var DATASET = __DATASET__;
  var CONFIGURATION = __CONFIGURATION__;
  var LICENSE_KEY = __LICENSE_KEY__; // JSON string or null
  // ---------------------------------------------------------
  var iframe = document.getElementById("light-runner-iframe");
  var payload = {
    type: "datama-light-payload",
    dataset: DATASET,
    configuration: CONFIGURATION
  };
  if (LICENSE_KEY) payload.userLicenseKey = LICENSE_KEY;
  // Send the payload as an object (not a JSON string). The runner reads
  // event.data.type directly, so a stringified payload would be ignored.
  function send() {
    try { iframe.contentWindow.postMessage(payload, "*"); } catch (e) {}
  }
  iframe.addEventListener("load", send);
})();
</script>
</body>
</html>
