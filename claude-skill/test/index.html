<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datama Compare — Test</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #fff; }
  h1 { font-size: 16px; margin: 12px 16px; color: #333; }
  #light-runner-wrap { width: 100%; min-height: 600px; }
  #light-runner-iframe {
    width: 100%;
    height: 600px;
    border: 1px solid #ddd;
    border-radius: 6px;
    display: block;
  }
</style>
</head>
<body>
<h1>Datama Compare — Test (e-commerce funnel, 2 periods × 2 countries)</h1>
<div id="light-runner-wrap">
  <iframe
    id="light-runner-iframe"
    src="https://storage.googleapis.com/app2.datama.io/ai-datama-light/latest/compare/runner.ai-toolkit.html"
    title="Datama Compare"></iframe>
</div>
<script>
(function () {
  var DATASET = [
    {"Date":"2024-01-01","Country":"FR","Sessions":1000,"ProductViews":700,"AddToCart":200,"Transactions":50,"Revenue":5000},
    {"Date":"2024-01-01","Country":"US","Sessions":1500,"ProductViews":1100,"AddToCart":300,"Transactions":80,"Revenue":10000},
    {"Date":"2024-01-02","Country":"FR","Sessions":1100,"ProductViews":750,"AddToCart":210,"Transactions":55,"Revenue":5500},
    {"Date":"2024-01-02","Country":"US","Sessions":1400,"ProductViews":1050,"AddToCart":280,"Transactions":75,"Revenue":9500},
    {"Date":"2024-01-03","Country":"FR","Sessions":900,"ProductViews":600,"AddToCart":150,"Transactions":35,"Revenue":3200},
    {"Date":"2024-01-03","Country":"US","Sessions":1600,"ProductViews":1200,"AddToCart":340,"Transactions":95,"Revenue":12500},
    {"Date":"2024-01-04","Country":"FR","Sessions":950,"ProductViews":620,"AddToCart":160,"Transactions":40,"Revenue":3800},
    {"Date":"2024-01-04","Country":"US","Sessions":1700,"ProductViews":1300,"AddToCart":360,"Transactions":100,"Revenue":13800}
  ];
  var CONFIGURATION = {
    "dimensions": ["Date", "Country"],
    "metrics": ["Sessions", "ProductViews", "AddToCart", "Transactions", "Revenue"],
    "steps": [
      {"numerator": "Sessions", "denominator": "", "name": "Sessions", "exclude": []},
      {"numerator": "ProductViews", "denominator": "Sessions", "name": "ProductViews / Sessions", "exclude": []},
      {"numerator": "AddToCart", "denominator": "ProductViews", "name": "AddToCart / ProductViews", "exclude": []},
      {"numerator": "Transactions", "denominator": "AddToCart", "name": "Transactions / AddToCart", "exclude": []},
      {"numerator": "Revenue", "denominator": "Transactions", "name": "Revenue / Transactions", "exclude": []}
    ],
    "inputs": {
      "formula": "[1]*[2]*[3]*[4]*[5]",
      "context": "Date",
      "start": ["2024-01-01", "2024-01-02"],
      "end": ["2024-01-03", "2024-01-04"],
      "relative": false,
      "order": "desc",
      "totalStepName": "Revenue (Total)",
      "totalStepUnit": "\u20ac",
      "metricForClustering": "Revenue"
    },
    "configuration": {}
  };
  var LICENSE_KEY = null;

  var iframe = document.getElementById("light-runner-iframe");
  var payload = {
    type: "datama-light-payload",
    dataset: DATASET,
    configuration: CONFIGURATION
  };
  if (LICENSE_KEY) payload.userLicenseKey = LICENSE_KEY;
  function send() {
    try {
      iframe.contentWindow.postMessage(payload, "*");
      console.log("payload sent");
    } catch (e) { console.error("postMessage failed", e); }
  }
  iframe.addEventListener("load", send);
})();
</script>
</body>
</html>
